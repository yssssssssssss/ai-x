schema_version: phase-a-profile-feasibility-v1
status: draft
runtime_consumed: false
review_gate: gate-2
catalog_snapshot_hash: sha256:9d8167f2659964a4dd42a27c7d320cf8545eeff037e8b288ae205173a2aa7921
dimension_order:
  - scope
  - method
  - evidence
  - review
  - output_emphasis
profile_order:
  - speed
  - depth
  - breadth
  - focused
  - mixed_method
  - decision
  - remediation
candidate_contract:
  min_items: 2
  max_items: 4
  baseline_profile_ids:
    - speed
    - depth
  legacy_runtime_order:
    - depth
    - speed
  deterministic_control: Candidate count, IDs, ordering, and recommendation remain deterministic; an LLM may not choose them.
  invariant_ids:
    - all_required_questions
    - all_required_evidence
    - all_requested_deliverables
    - evidence_policy_unchanged
    - approval_and_privacy_policy_unchanged
profile_specs:
  - id: speed
    ordinal: 0
    kind: baseline
    display_name: 快速判断
    max_steps: 4
    dimensions:
      scope: minimum_sufficient_full_coverage
      method: shortest_eligible_path_per_required_question
      evidence: minimum_required_no_waiver
      review: mandatory_only
      output_emphasis:
        - complete_requested_deliverables
        - explicit_gaps
    required_difference_dimensions:
      - scope
      - method
      - evidence
      - review
  - id: depth
    ordinal: 1
    kind: baseline
    display_name: 深度研究
    max_steps: 8
    dimensions:
      scope: balanced_full_object_and_question_coverage
      method: cross_source_and_counterevidence
      evidence: triangulated_with_counterevidence
      review: enhanced_consistency_and_alternatives
      output_emphasis:
        - evidence_consistency
        - risks
        - alternative_explanations
    required_difference_dimensions:
      - scope
      - evidence
      - review
  - id: breadth
    ordinal: 2
    kind: specialty
    display_name: 广度扫描
    max_steps: 8
    dimensions:
      scope: expanded_task_scope_units
      method: repeat_minimum_sufficient_path_per_scope_unit
      evidence: minimum_required_per_scope_unit
      review: coverage_matrix_consistency
      output_emphasis:
        - coverage_matrix
        - cross_unit_commonalities
        - cross_unit_differences
    required_difference_dimensions:
      - scope
      - evidence
      - output_emphasis
  - id: focused
    ordinal: 3
    kind: specialty
    display_name: 聚焦关键链路
    max_steps: 6
    dimensions:
      scope: user_named_focus_with_global_required_floor
      method: focused_deep_dive
      evidence: higher_density_in_focus_required_elsewhere
      review: focus_attribution
      output_emphasis:
        - focused_root_cause
        - focused_actions
    required_difference_dimensions:
      - scope
      - evidence
      - output_emphasis
  - id: mixed_method
    ordinal: 4
    kind: specialty
    display_name: 混合方法
    max_steps: 8
    dimensions:
      scope: required_scope
      method: two_or_more_independent_method_families
      evidence: triangulated_independent_paths
      review: conflict_and_limitation_review
      output_emphasis:
        - convergence
        - conflicts
        - limitations
    required_difference_dimensions:
      - method
      - evidence
      - review
  - id: decision
    ordinal: 5
    kind: specialty
    display_name: 决策收敛
    max_steps: 7
    dimensions:
      scope: decision_options_and_implementation_bounds
      method: comparative_tradeoff_prioritization
      evidence: option_comparison_risk_priority
      review: decision_risk_review
      output_emphasis:
        - tradeoffs
        - roadmap
        - metrics
        - validation_plan
    required_difference_dimensions:
      - method
      - evidence
      - output_emphasis
  - id: remediation
    ordinal: 6
    kind: specialty
    display_name: 整改复测
    max_steps: 7
    dimensions:
      scope: identified_issues_and_affected_flow
      method: diagnose_remediate_retest
      evidence: baseline_action_retest_or_retest_plan
      review: acceptance_threshold_review
      output_emphasis:
        - issue_action_retest_trace
        - acceptance_thresholds
    required_difference_dimensions:
      - scope
      - method
      - evidence
      - output_emphasis
