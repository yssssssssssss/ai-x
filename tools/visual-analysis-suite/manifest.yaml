id: visual-analysis-suite
name: 多实验室视觉分析套件
adapter_type: visual_suite
entrypoint: internal:visual-analysis-suite
auth_required: false
risk_level: low
approver_rule: none
timeout_seconds: 180
retry_policy:
  max_attempts: 1
  backoff_seconds: 0
input_schema: tools/visual-analysis-suite/input.schema.json
output_schema: tools/visual-analysis-suite/output.schema.json
redaction_policy:
  pii: mask
  sensitive_business_data: block
image_input_fields:
  - field: designImages
    multiple: true
    role: designImage
  - field: jd_screenshots
    multiple: true
    role: jd_screenshots
  - field: competitor_screenshots
    multiple: true
    role: competitor_screenshots
