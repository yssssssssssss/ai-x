name: Quality

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: user_research_ai
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d user_research_ai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/user_research_ai
      JWT_SECRET: ci-only-secret
      LLM_PROVIDER: mock
      TOOL_ADAPTER: fake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@9.12.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm quality
      - run: pnpm --dir apps/web build

  skill-native-real-smoke:
    name: Skill-native real smoke
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: user_research_ai
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d user_research_ai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/user_research_ai
      LLM_GATEWAY_BASE_URL: ${{ secrets.LLM_GATEWAY_BASE_URL }}
      LLM_GATEWAY_API_KEY: ${{ secrets.LLM_GATEWAY_API_KEY }}
      LLM_MODEL_NAME: ${{ secrets.LLM_MODEL_NAME }}
      LLM_EXPECTED_ACTUAL_MODEL: ${{ secrets.LLM_EXPECTED_ACTUAL_MODEL }}
      LLM_MODEL_ROUTES: ${{ secrets.LLM_MODEL_ROUTES }}
      SKILL_SANDBOX_IMAGE: ${{ secrets.SKILL_SANDBOX_IMAGE }}
      ALLOW_REAL_PROVIDER: '1'
      LLM_PROVIDER: gateway
      TOOL_ADAPTER: real
      ZERO_PUBLICATION_ENABLED: 'false'
    steps:
      - name: Require real smoke secrets
        shell: bash
        run: |
          required=(
            LLM_GATEWAY_BASE_URL
            LLM_GATEWAY_API_KEY
            SKILL_SANDBOX_IMAGE
          )
          if [[ -z "${LLM_MODEL_ROUTES:-}" ]]; then
            required+=(LLM_MODEL_NAME LLM_EXPECTED_ACTUAL_MODEL)
          fi
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "Missing required Skill-native real smoke secrets: ${missing[*]}" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.12.1 --activate
      - name: Install application dependencies
        run: pnpm install --frozen-lockfile
      - name: Migrate and seed smoke database
        run: |
          pnpm db:migrate
          pnpm db:seed
      - name: Run native Single, Multi, and OCI smoke
        shell: bash
        env:
          RUN_WORKSPACE_ROOT: ${{ runner.temp }}/skill-native-real-smoke
        run: |
          set -euo pipefail
          pnpm smoke:skill-native:real
