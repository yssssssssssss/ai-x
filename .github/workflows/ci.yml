name: Quality

on:
  pull_request:
  push:

jobs:
  playwright-contract:
    name: Playwright in-memory no-request contract
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: mock
      TOOL_ADAPTER: fake
      PLAYWRIGHT_CONTRACT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@9.12.1 --activate
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run about-blank in-memory Chromium contract
        run: pnpm exec tsx --test tests/playwright-page-capture-adapter.test.ts

  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: user_research_ai
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d user_research_ai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/user_research_ai
      JWT_SECRET: ci-only-secret
      LLM_PROVIDER: mock
      TOOL_ADAPTER: fake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@9.12.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm quality
      - run: pnpm --dir apps/web build

  current-real-smoke:
    name: Current real smoke (five profiles)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: user_research_ai
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d user_research_ai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/user_research_ai
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      LLM_GATEWAY_BASE_URL: ${{ secrets.LLM_GATEWAY_BASE_URL }}
      LLM_GATEWAY_API_KEY: ${{ secrets.LLM_GATEWAY_API_KEY }}
      LLM_MODEL_NAME: ${{ secrets.LLM_MODEL_NAME }}
      LLM_EXPECTED_ACTUAL_MODEL: ${{ secrets.LLM_EXPECTED_ACTUAL_MODEL }}
      LLM_MODEL_ROUTES: ${{ secrets.LLM_MODEL_ROUTES }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      ALLOW_REAL_PROVIDER: '1'
      LLM_PROVIDER: gateway
      TOOL_ADAPTER: real
      CURRENT_DESIGN_SMOKE_IMAGE_PATH: ${{ github.workspace }}/knowledge-base/assets/playbooks/images/jingxi-img-01.png
      RUN_WORKSPACE_ROOT: ${{ runner.temp }}/current-real-smoke
    steps:
      - name: Check real smoke secrets
        id: secret_gate
        shell: bash
        run: |
          required=(
            JWT_SECRET
            LLM_GATEWAY_BASE_URL
            LLM_GATEWAY_API_KEY
            LLM_MODEL_NAME
            LLM_EXPECTED_ACTUAL_MODEL
            TAVILY_API_KEY
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Current real smoke skipped; missing repository secrets: ${missing[*]}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secret_gate.outputs.enabled == 'true'
      - uses: actions/setup-node@v4
        if: steps.secret_gate.outputs.enabled == 'true'
        with:
          node-version: 22
      - name: Enable pnpm
        if: steps.secret_gate.outputs.enabled == 'true'
        run: |
          corepack enable
          corepack prepare pnpm@9.12.1 --activate
      - name: Install application and design lab dependencies
        if: steps.secret_gate.outputs.enabled == 'true'
        run: |
          pnpm install --frozen-lockfile
          npm ci --prefix external-tools/aesthetic-quant-lab
          npm ci --prefix external-tools/attention-analysis-lab
          npm ci --prefix external-tools/vision-brand-lab
      - name: Migrate and seed smoke database
        if: steps.secret_gate.outputs.enabled == 'true'
        run: |
          pnpm db:migrate
          pnpm db:seed
      - name: Run five profiles sequentially
        if: steps.secret_gate.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          lab_pids=()
          stop_labs() {
            if (( ${#lab_pids[@]} > 0 )); then
              kill "${lab_pids[@]}" 2>/dev/null || true
            fi
          }
          trap stop_labs EXIT
          npm --prefix external-tools/aesthetic-quant-lab run dev:server > "$RUNNER_TEMP/aesthetic-quant-lab.log" 2>&1 &
          lab_pids+=("$!")
          npm --prefix external-tools/attention-analysis-lab run dev:server > "$RUNNER_TEMP/attention-analysis-lab.log" 2>&1 &
          lab_pids+=("$!")
          npm --prefix external-tools/vision-brand-lab run dev:server > "$RUNNER_TEMP/vision-brand-lab.log" 2>&1 &
          lab_pids+=("$!")
          for port in 8801 8802 8805; do
            curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 1 \
              "http://127.0.0.1:${port}/api/health" > /dev/null
          done
          for profile in \
            competitive_research \
            user_research_planning \
            voc_diagnosis \
            design_audit \
            a11y_audit; do
            CURRENT_SMOKE_PROFILE="$profile" pnpm smoke:current:real
          done
