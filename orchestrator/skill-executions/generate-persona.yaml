version: skill-execution-contract-v1
skill_id: generate-persona
required_requirement_fields: [/research_goal]
resources:
  - resource_id: toolbox_collection_persona
    required: true
    accepted_statuses: [approved, draft]
    purpose: Apply the canonical Persona creation method and output structure.
    failure_policy: block
  - resource_id: toolbox_analysis_affinity_diagram
    required: true
    accepted_statuses: [approved, draft]
    purpose: Cluster traceable observations into candidate user types.
    failure_policy: block
  - resource_id: toolbox_analysis_qualitative_insight_frameworks
    required: true
    accepted_statuses: [approved, draft]
    purpose: Use qualitative insight frameworks to deepen evidence-bound Persona needs and behavior.
    failure_policy: block
  - resource_id: model_user_insight
    required: true
    accepted_statuses: [approved, draft]
    purpose: Distinguish observations, conclusions, and deeper user insight without inventing evidence.
    failure_policy: block
skill_references:
  - references/persona-skeleton.md
stages:
  - stage_id: load-persona-methods
    title: 加载 Persona 方法
    actor_type: knowledge
    actor_id: knowledge.index
    depends_on: []
    input: {}
    input_bindings: []
    expected_outputs:
      - pointer: /resources
        description: Frozen verified Persona knowledge resources.
    acceptance_criteria:
      - Every required resource matches its frozen identity and hash.
    failure_policy: block
  - stage_id: collect-public-evidence
    title: 检索直接回答所需公开证据
    actor_type: tool
    actor_id: tavily-web-search
    share_scope: plan
    share_input_fields: [query, topic, max_results, search_depth, include_answer]
    depends_on: []
    input:
      query: research goal direct answers official evidence
      topic: general
      max_results: 12
      search_depth: advanced
      include_answer: advanced
    frozen_input_fields: [query, topic, max_results, search_depth, include_answer]
    input_bindings: []
    expected_outputs:
      - pointer: /results
        description: Traceable public evidence for required questions.
    acceptance_criteria:
      - Results include traceable URLs relevant to required questions.
    failure_policy: block
  - stage_id: compose-persona-contribution
    title: 形成 Persona 研究贡献
    actor_type: skill
    actor_id: generate-persona
    depends_on: [load-persona-methods, collect-public-evidence]
    input:
      instruction: Produce one evidence-bound Persona Research Contribution. Treat public evidence as provisional context, never invent user observations or quotations, and disclose missing primary user evidence.
      knowledge: null
      public_evidence: null
    input_bindings:
      - target_pointer: /knowledge
        source_stage_id: load-persona-methods
        source_pointer: /resources
      - target_pointer: /public_evidence
        source_stage_id: collect-public-evidence
        source_pointer: /results
    expected_outputs:
      - pointer: /payload
        description: generate-persona payload
    acceptance_criteria:
      - Persona units distinguish evidence-backed observations from provisional hypotheses and disclose evidence gaps.
    failure_policy: block
output_stage_id: compose-persona-contribution
output_pointer: /payload
degraded_policy: gap
