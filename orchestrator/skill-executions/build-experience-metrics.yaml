version: skill-execution-contract-v1
skill_id: build-experience-metrics
required_requirement_fields: [/research_goal]
resources:
  - resource_id: toolbox_analysis_experience_metrics_heart
    required: true
    accepted_statuses: [approved, draft]
    purpose: Apply HEART and GSM to derive experience goals, signals, and metrics.
    failure_policy: block
skill_references:
  - references/metrics-system-skeleton.md
stages:
  - stage_id: load-metrics-methods
    title: 加载体验度量方法
    actor_type: knowledge
    actor_id: knowledge.index
    depends_on: []
    input: {}
    input_bindings: []
    expected_outputs:
      - pointer: /resources
        description: Frozen verified experience-metrics knowledge resources.
    acceptance_criteria:
      - Every required resource matches its frozen identity and hash.
    failure_policy: block
  - stage_id: collect-public-evidence
    title: 检索直接回答所需公开证据
    actor_type: tool
    actor_id: tavily-web-search
    share_scope: plan
    share_input_fields: [query, topic, max_results, search_depth, include_answer]
    depends_on: []
    input:
      query: research goal direct answers official evidence
      topic: general
      max_results: 12
      search_depth: advanced
      include_answer: advanced
    frozen_input_fields: [query, topic, max_results, search_depth, include_answer]
    input_bindings: []
    expected_outputs:
      - pointer: /results
        description: Traceable public evidence for required questions.
    acceptance_criteria:
      - Results include traceable URLs relevant to required questions.
    failure_policy: block
  - stage_id: compose-metrics-contribution
    title: 形成体验度量研究贡献
    actor_type: skill
    actor_id: build-experience-metrics
    depends_on: [load-metrics-methods, collect-public-evidence]
    input:
      instruction: Produce one evidence-bound experience-metrics Research Contribution. Define operational metrics and validation needs without inventing baselines, measurements, or user behavior.
      knowledge: null
      public_evidence: null
    input_bindings:
      - target_pointer: /knowledge
        source_stage_id: load-metrics-methods
        source_pointer: /resources
      - target_pointer: /public_evidence
        source_stage_id: collect-public-evidence
        source_pointer: /results
    expected_outputs:
      - pointer: /payload
        description: build-experience-metrics payload
    acceptance_criteria:
      - Metric units distinguish sourced baselines from proposed measures and disclose missing data.
    failure_policy: block
output_stage_id: compose-metrics-contribution
output_pointer: /payload
degraded_policy: gap
