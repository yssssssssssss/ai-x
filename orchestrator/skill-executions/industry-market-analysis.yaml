version: skill-execution-contract-v1
skill_id: industry-market-analysis
required_requirement_fields: [/research_goal, /industry_scope, /success_criteria]
resources: []
skill_references:
  - references/industry-method.md
stages:
  - stage_id: load-industry-methods
    title: 加载行业分析方法与平台基线
    actor_type: knowledge
    actor_id: knowledge.index
    depends_on: []
    input: {}
    input_bindings: []
    expected_outputs:
      - pointer: /resources
        description: Frozen Industry Market Analysis method resources.
    acceptance_criteria:
      - Runtime method references are frozen by path and hash.
    failure_policy: block
  - stage_id: collect-public-evidence
    title: 检索直接回答所需公开证据
    actor_type: tool
    actor_id: tavily-web-search
    share_scope: plan
    share_input_fields: [query, topic, max_results, search_depth, include_answer]
    depends_on: []
    input:
      query: research goal direct answers official evidence
      topic: general
      max_results: 12
      search_depth: advanced
      include_answer: advanced
    frozen_input_fields: [query, topic, max_results, search_depth, include_answer]
    input_bindings: []
    expected_outputs:
      - pointer: /results
        description: Traceable public evidence for required questions.
    acceptance_criteria:
      - Results include traceable URLs relevant to required questions.
    failure_policy: block
  - stage_id: inventory-inputs-and-evidence
    title: 盘点输入、证据与十维缺口
    actor_type: llm
    actor_id: llm.openai.gpt-4o
    depends_on: [load-industry-methods, collect-public-evidence]
    input:
      methods: null
      public_evidence: null
      instruction: Inventory A-J coverage and distinguish facts, provisional analysis, simulation, and unavailable evidence. Do not draft recommendations.
    input_bindings:
      - target_pointer: /methods
        source_stage_id: load-industry-methods
        source_pointer: /resources
      - target_pointer: /public_evidence
        source_stage_id: collect-public-evidence
        source_pointer: /results
    expected_outputs:
      - pointer: /text
        description: Question-indexed evidence and data-gap inventory.
    acceptance_criteria:
      - Every A-J dimension is supported, partial, or unavailable.
    failure_policy: block
  - stage_id: analyze-market-users-and-supply
    title: 分析市场、用户与供给
    actor_type: llm
    actor_id: llm.openai.gpt-4o
    depends_on: [inventory-inputs-and-evidence]
    input:
      evidence_inventory: null
      instruction: Analyze market, audience, supply, and business logic without inventing user observations or metrics.
    input_bindings:
      - target_pointer: /evidence_inventory
        source_stage_id: inventory-inputs-and-evidence
        source_pointer: /text
    expected_outputs:
      - pointer: /text
        description: Evidence-bound market, audience, supply, and business analysis.
    acceptance_criteria:
      - Unsupported user and market claims remain provisional or unavailable.
    failure_policy: block
  - stage_id: diagnose-jd-and-competitors
    title: 诊断京东现状与竞品差异
    actor_type: llm
    actor_id: llm.openai.gpt-4o
    depends_on: [inventory-inputs-and-evidence]
    input:
      evidence_inventory: null
      instruction: Diagnose only the JD and competitor states supported by verified materials; preserve screenshot and dataset gaps.
    input_bindings:
      - target_pointer: /evidence_inventory
        source_stage_id: inventory-inputs-and-evidence
        source_pointer: /text
    expected_outputs:
      - pointer: /text
        description: Evidence-bound JD and competitor diagnosis.
    acceptance_criteria:
      - Every diagnosis is tied to a verified source or marked unavailable.
    failure_policy: block
  - stage_id: cross-validate-findings
    title: 交叉验证行业发现
    actor_type: reviewer
    actor_id: reviewer.research-lead
    depends_on: [inventory-inputs-and-evidence, analyze-market-users-and-supply, diagnose-jd-and-competitors]
    input:
      evidence_inventory: null
      market_analysis: null
      diagnosis: null
      instruction: Challenge unsupported claims, conflicts, certainty, category specificity, and missing evidence.
    input_bindings:
      - target_pointer: /evidence_inventory
        source_stage_id: inventory-inputs-and-evidence
        source_pointer: /text
      - target_pointer: /market_analysis
        source_stage_id: analyze-market-users-and-supply
        source_pointer: /text
      - target_pointer: /diagnosis
        source_stage_id: diagnose-jd-and-competitors
        source_pointer: /text
    expected_outputs:
      - pointer: /review
        description: Cross-validation review and binding conditions.
    acceptance_criteria:
      - Unsupported claims and required validation are explicit.
    failure_policy: block
  - stage_id: synthesize-opportunities-and-assets
    title: 合成机会、品类资产与策略纵深链
    actor_type: llm
    actor_id: llm.openai.gpt-4o
    depends_on: [analyze-market-users-and-supply, diagnose-jd-and-competitors, cross-validate-findings]
    input:
      market_analysis: null
      diagnosis: null
      validation_review: null
      instruction: Derive gaps, positioning, opportunities, design language, category assets, and evidence-bound strategy chains. Unknown metrics remain null.
    input_bindings:
      - target_pointer: /market_analysis
        source_stage_id: analyze-market-users-and-supply
        source_pointer: /text
      - target_pointer: /diagnosis
        source_stage_id: diagnose-jd-and-competitors
        source_pointer: /text
      - target_pointer: /validation_review
        source_stage_id: cross-validate-findings
        source_pointer: /review
    expected_outputs:
      - pointer: /text
        description: Evidence-bound Industry strategy and category-asset draft.
    acceptance_criteria:
      - Every P0 strategy has a concrete validation method and no invented result.
    failure_policy: block
  - stage_id: compose-industry-content-draft
    title: 合成结构化行业市场分析
    actor_type: skill
    actor_id: industry-market-analysis
    depends_on: [load-industry-methods, inventory-inputs-and-evidence, analyze-market-users-and-supply, diagnose-jd-and-competitors, cross-validate-findings, synthesize-opportunities-and-assets]
    input:
      instruction: >-
        Produce one industry-market-content-draft-v1 payload. Preserve evidence identities and explicit gaps.
        Do not produce HTML or machine-owned envelope fields. When contribution_bundle is non-empty, every absorbed
        Contributor Unit must be mapped through support.sourceContributionUnitIds using the exact
        <artifactId>:<unitKey> identifier and its statement must remain verbatim inside the target statement.
        Any omitted Unit must be listed in contributionExclusions with its exact Unit identifier and reason.
      research_goal: null
      jd_screenshots: null
      competitor_screenshots: null
      competitor_platform_names: null
      user_research_dataset: null
      internal_metrics_dataset: null
      methods: null
      evidence_inventory: null
      market_analysis: null
      diagnosis: null
      validation_review: null
      strategy_and_assets: null
      contribution_order: []
      contribution_bundle: {}
    input_bindings:
      - target_pointer: /methods
        source_stage_id: load-industry-methods
        source_pointer: /resources
      - target_pointer: /evidence_inventory
        source_stage_id: inventory-inputs-and-evidence
        source_pointer: /text
      - target_pointer: /market_analysis
        source_stage_id: analyze-market-users-and-supply
        source_pointer: /text
      - target_pointer: /diagnosis
        source_stage_id: diagnose-jd-and-competitors
        source_pointer: /text
      - target_pointer: /validation_review
        source_stage_id: cross-validate-findings
        source_pointer: /review
      - target_pointer: /strategy_and_assets
        source_stage_id: synthesize-opportunities-and-assets
        source_pointer: /text
    expected_outputs:
      - pointer: /payload
        description: Typed Industry Market content draft.
    acceptance_criteria:
      - All ten dimensions have explicit coverage states and every claim preserves its evidence boundary.
      - Every absorbed Contributor Unit has an exact sourceContributionUnitIds mapping; every omitted Unit is listed in contributionExclusions with a reason.
    failure_policy: block
  - stage_id: self-review
    title: 审校行业报告完整性与可执行性
    actor_type: reviewer
    actor_id: reviewer.research-lead
    depends_on: [compose-industry-content-draft]
    input:
      report: null
      instruction: Review ten-dimension coverage, evidence strength, Persona boundaries, category specificity, strategy-chain actionability, measurement, and data gaps.
    input_bindings:
      - target_pointer: /report
        source_stage_id: compose-industry-content-draft
        source_pointer: /payload
    expected_outputs:
      - pointer: /review
        description: Industry content review.
    acceptance_criteria:
      - Unsupported claims, missing dimensions, unusable actions, and undisclosed gaps are explicit.
    failure_policy: block
output_stage_id: compose-industry-content-draft
output_pointer: /payload
degraded_policy: gap
