# tool 轻量索引卡(方案 §2.3)
# 只保留发现/治理/预筛所需字段;执行边界(超时/重试/脱敏)在各 tool 的 manifest.yaml。
# 业务判断"什么任务该调我"不写在这里,由 LLM + skill 决定。

version: 1

tools:
  - id: o2-web-search
    name: o2 网页检索
    path: tools/o2-web-search/manifest.yaml
    adapter_type: o2
    auth_required: true
    risk_level: low
    status: draft
    tier: optional        # 尚无可证明真实身份的 O2 adapter,不得进入 P0

  - id: joyspace-read
    name: Joyspace 只读知识
    path: tools/joyspace-read/manifest.yaml
    adapter_type: o2
    auth_required: true
    risk_level: low
    status: active
    tier: optional

  - id: tavily-web-search
    name: Tavily 网页检索
    path: tools/tavily-web-search/manifest.yaml
    adapter_type: tavily
    auth_required: true
    risk_level: low
    status: active
    tier: core            # 同上,公开证据主检索

  - id: playwright-page-capture
    name: Playwright 网页视觉取证
    path: tools/playwright-page-capture/manifest.yaml
    adapter_type: playwright
    auth_required: false
    risk_level: medium
    status: draft
    tier: optional        # 平台 egress/non-root/sandbox 证据齐备前不得激活

  - id: ai-spider-search
    name: 竞品截图库检索
    path: tools/ai-spider-search/manifest.yaml
    adapter_type: internal_api
    auth_required: true
    risk_level: low
    status: active
    tier: optional        # 依赖外部截图库后端,增强性;缺失不阻断报告(自动跳过成缺口)

  # external-tools/*-lab:无鉴权 REST 工具,走 RestJsonAdapter(rest_json)。
  - id: aesthetic-quant-lab
    name: 美学量化实验室
    path: tools/aesthetic-quant-lab/manifest.yaml
    adapter_type: rest_json
    auth_required: false
    risk_level: low
    status: active
    tier: optional        # 依赖外部 lab 后端,增强性

  - id: attention-analysis-lab
    name: 视觉注意力分析实验室
    path: tools/attention-analysis-lab/manifest.yaml
    adapter_type: rest_json
    auth_required: false
    risk_level: low
    status: active
    tier: optional

  - id: experience-model-lab
    name: 体验模型实验室
    path: tools/experience-model-lab/manifest.yaml
    adapter_type: rest_json
    auth_required: false
    risk_level: low
    status: active
    tier: optional

  - id: virtual-user-lab
    name: 虚拟用户实验室
    path: tools/virtual-user-lab/manifest.yaml
    adapter_type: rest_json
    auth_required: false
    risk_level: low
    status: active
    tier: optional

  - id: vision-brand-lab
    name: 视觉品牌实验室
    path: tools/vision-brand-lab/manifest.yaml
    adapter_type: rest_json
    auth_required: false
    risk_level: low
    status: active
    tier: optional
