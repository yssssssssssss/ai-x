version: 1
id: competitive-analysis-report
dimensions:
  - id: requirement_coverage
    required: true
    criterion: Every requested market, competitor, and comparison scope is addressed.
  - id: question_coverage
    required: true
    criterion: Each required research question is answered by the comparison.
  - id: evidence_coverage
    required: true
    criterion: Samples, matrix values, differences, and screenshots are traceable to evidence.
  - id: reasoning_quality
    required: true
    criterion: Differences and impacts follow coherently from observed comparisons; every strategy direction identifies the bounded phenomenon, attribution, and insight it responds to.
  - id: recommendation_quality
    required: true
    criterion: Actions are prioritized, specific, rooted in identified differences, and include user impact, business impact, cost or risk, a target metric, and a concrete validation method.
  - id: visual_quality
    required: true
    criterion: Each visualEvidence browser image is legible, relevant, and bound to matching screenshot Evidence plus same-URL public_source Evidence. When structured user-upload visuals exist, visualInputPresentation must cover every verified input original exactly once, preserve each Material role and index, use only exact annotation lineage, and use only explicit user-confirmed pairs; grouped mode must not infer pairings. Legacy screenshotComparisons may contain only exact original-to-annotation pairs. Without displayable visual material, empty visual arrays are valid and no Asset id is invented.
  - id: risk_disclosure
    required: true
    criterion: Sampling limits, evidence gaps, and uncertainty are explicit.
