version: 1
id: accessibility-audit-report
dimensions:
  - id: requirement_coverage
    required: true
    criterion: Every requested platform, assistive technology, component, and scope is addressed.
  - id: question_coverage
    required: true
    criterion: Each required accessibility question is answered by tested behavior.
  - id: evidence_coverage
    required: true
    criterion: Findings identify affected components, criteria, and observed behavior.
  - id: reasoning_quality
    required: true
    criterion: POUR, A/B/C, and P0-P3 classifications are consistent and justified.
  - id: recommendation_quality
    required: true
    criterion: Remediations and verification steps are issue-linked and testable.
  - id: visual_quality
    required: true
    criterion: Visual evidence and descriptions remain understandable to assistive-technology users.
  - id: risk_disclosure
    required: true
    criterion: Untested combinations, tooling limits, and residual accessibility risk are explicit.
