version: 1
id: voc-diagnosis-report
dimensions:
  - id: requirement_coverage
    required: true
    criterion: Every requested dataset, audience, and diagnosis scope is addressed.
  - id: question_coverage
    required: true
    criterion: Each required diagnosis question is answered by the theme analysis.
  - id: evidence_coverage
    required: true
    criterion: Themes and quotes are traceable and quantitative claims match dataset counts.
  - id: reasoning_quality
    required: true
    criterion: Frequency, sentiment, and severity interpretations are methodologically sound.
  - id: recommendation_quality
    required: true
    criterion: Priorities are justified by frequency, sentiment, and severity.
  - id: visual_quality
    required: true
    criterion: Quantitative summaries are readable and do not distort the underlying data.
  - id: risk_disclosure
    required: true
    criterion: Dataset bias, missing records, privacy limits, and uncertainty are explicit.
